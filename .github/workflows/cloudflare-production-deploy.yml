name: Deploy IPÌLẸ̀ Cloudflare production

on:
  workflow_dispatch:
    inputs:
      approve_production_frontend_deployment:
        description: "Confirm deployment of the current main frontend to the existing production Worker (ipile-web)."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipile-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ inputs.approve_production_frontend_deployment == true }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IPILE_PRODUCTION_BACKEND_URL: https://ipile-bmfz.onrender.com
      IPILE_PRODUCTION_WORKER_NAME: ipile-web

    steps:
      - name: Checkout approved main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify production deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          [[ "$IPILE_PRODUCTION_BACKEND_URL" == "https://ipile-bmfz.onrender.com" ]] || { echo "Unexpected production backend URL."; exit 1; }

      - name: Verify production backend liveness
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 5 --max-time 20 \
            "$IPILE_PRODUCTION_BACKEND_URL/api/v1/health/live"

      - name: Verify production backend readiness
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 5 --max-time 20 \
            "$IPILE_PRODUCTION_BACKEND_URL/api/v1/health"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Install Cloudflare build tooling
        working-directory: frontend
        run: npm run cf:install

      - name: Build production Worker
        working-directory: frontend
        env:
          BACKEND_URL: https://ipile-bmfz.onrender.com
        run: npm run cf:build

      - name: Verify production Worker deployment configuration
        working-directory: frontend
        run: npx wrangler deploy --dry-run --name "$IPILE_PRODUCTION_WORKER_NAME"

      - name: Bind production API and deploy existing production Worker
        working-directory: frontend
        shell: bash
        run: |
          printf '%s' "$IPILE_PRODUCTION_BACKEND_URL" | npx wrangler secret put BACKEND_URL --name "$IPILE_PRODUCTION_WORKER_NAME"
          set -o pipefail
          npx wrangler deploy --name "$IPILE_PRODUCTION_WORKER_NAME" 2>&1 | tee /tmp/ipile-production-wrangler-deploy.log

      - name: Smoke-test deployed production frontend and API proxy
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_FRONTEND_URL="https://ipile-web.ipile-71a.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 5 --max-time 20 \
            -H "Cache-Control: no-cache" \
            "$PRODUCTION_FRONTEND_URL/?deploy_sha=$GITHUB_SHA" -o /tmp/ipile-production-home.html
          grep -qi "<html" /tmp/ipile-production-home.html

          grep -Fq "Your money. In harmony." frontend/components/landing/LandingMockup.tsx
          if grep -Fq "IPÌLẸ̀ brings your money, accounts, spending" frontend/components/landing/LandingMockup.tsx; then
            echo "Production source contains the removed hero paragraph."
            exit 1
          fi
          if grep -Fq "Know what you have. Know what it is committed to." frontend/components/landing/LandingMockup.tsx; then
            echo "Production source contains the removed hero proof statement."
            exit 1
          fi
          grep -RFlq "Your money. In harmony." frontend/.open-next/assets
          if grep -RFlq "IPÌLẸ̀ brings your money, accounts, spending" frontend/.open-next/assets; then
            echo "Compiled production assets contain the removed hero paragraph."
            exit 1
          fi
          if grep -RFlq "Know what you have. Know what it is committed to." frontend/.open-next/assets; then
            echo "Compiled production assets contain the removed hero proof statement."
            exit 1
          fi

          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 5 --max-time 20 \
            "$PRODUCTION_FRONTEND_URL/api/v1/health" -o /tmp/ipile-production-api-health.json
          grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/ipile-production-api-health.json

          echo "Production frontend and proxied API health checks passed." >> "$GITHUB_STEP_SUMMARY"

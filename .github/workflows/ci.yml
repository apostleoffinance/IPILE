name: CI

# Cloudflare Workers is the only production frontend deployment target.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Dependency audit
        run: pip install pip-audit && pip-audit
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm test

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ipile
          POSTGRES_USER: ipile
          POSTGRES_PASSWORD: ipile-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipile -d ipile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ipile:ipile-ci-password@localhost:5432/ipile
      DATABASE_MIGRATION_URL: postgresql+psycopg://ipile:ipile-ci-password@localhost:5432/ipile
      ENVIRONMENT: test
      SEED_ON_START: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Upgrade an empty PostgreSQL database to head
        run: alembic upgrade head
      - name: Verify database revision matches all migration heads
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          expected_heads = set(script.get_heads())
          engine = create_engine(__import__("os").environ["DATABASE_URL"])
          with engine.connect() as connection:
              actual_heads = set(connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalars())
          assert actual_heads == expected_heads, (
              f"Migration mismatch: expected {expected_heads}, got {actual_heads}"
          )
          print(f"Verified migration head(s): {sorted(actual_heads)}")
          engine.dispose()
          PY

  release-acceptance:
    needs: [backend, frontend, migration-smoke]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Run multi-household release acceptance
        run: pytest -q tests/test_release_acceptance.py --junitxml=release-acceptance.xml
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipile-release-acceptance
          path: backend/release-acceptance.xml
          if-no-files-found: warn
          retention-days: 30

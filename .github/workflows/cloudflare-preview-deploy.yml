name: Deploy IPÌLẸ̀ Cloudflare production

on:
  workflow_dispatch:
    inputs:
      release_approval:
        description: "Explicit approval for the IPÌLẸ̀ production frontend deployment"
        required: true
        type: choice
        options:
          - NOT_APPROVED
          - APPROVE_PRODUCTION_FRONTEND_DEPLOYMENT

permissions:
  contents: read

concurrency:
  group: ipile-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IPILE_PRODUCTION_BACKEND_URL: https://ipile-bmfz.onrender.com

    steps:
      - name: Checkout protected main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require explicit production deployment approval
        env:
          RELEASE_APPROVAL: ${{ inputs.release_approval }}
        shell: bash
        run: |
          if [[ "$RELEASE_APPROVAL" != "APPROVE_PRODUCTION_FRONTEND_DEPLOYMENT" ]]; then
            echo "Production deployment was not explicitly approved."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify production deployment configuration
        shell: bash
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN environment secret."; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID environment secret."; exit 1; }
          [[ "$IPILE_PRODUCTION_BACKEND_URL" == "https://ipile-bmfz.onrender.com" ]] || { echo "Unexpected production backend URL."; exit 1; }

      - name: Install application dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Install Cloudflare build tooling
        working-directory: frontend
        run: npm run cf:install

      - name: Build production Worker
        working-directory: frontend
        run: npm run cf:build

      - name: Verify Worker deployment configuration
        working-directory: frontend
        run: npx wrangler deploy --dry-run --name ipile-web

      - name: Verify production backend liveness before frontend deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 5 --max-time 15 \
            "$IPILE_PRODUCTION_BACKEND_URL/api/v1/health/live"

      - name: Verify production backend readiness before frontend deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 5 --max-time 15 \
            "$IPILE_PRODUCTION_BACKEND_URL/api/v1/health"

      - name: Bind production API and deploy once
        working-directory: frontend
        shell: bash
        run: |
          printf '%s' "$IPILE_PRODUCTION_BACKEND_URL" | npx wrangler secret put BACKEND_URL --name ipile-web
          npx wrangler deploy --name ipile-web

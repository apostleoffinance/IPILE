name: Deploy IPÌLẸ̀ Cloudflare production

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag containing the Cloudflare-ready frontend"
        required: true
        default: "milestone/ipile-fe-01-cloudflare"
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IPILE_PRODUCTION_BACKEND_URL: https://ipile-bmfz.onrender.com

    steps:
      - name: Checkout Cloudflare-ready source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify production deployment configuration
        shell: bash
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          [[ "$IPILE_PRODUCTION_BACKEND_URL" == "https://ipile-bmfz.onrender.com" ]] || { echo "Unexpected production backend URL."; exit 1; }

      - name: Install application dependencies
        run: npm ci

      - name: Verify Cloudflare scripts exist
        run: |
          node -e "const s=require('./package.json').scripts||{}; for (const k of ['cf:install','cf:build']) { if (!s[k]) { console.error('Missing frontend script: '+k); process.exitCode=1; } }"

      - name: Install Cloudflare build tooling
        run: npm run cf:install

      - name: Build production Worker
        run: npm run cf:build

      - name: Create production Worker
        run: npx wrangler deploy --name ipile-web

      - name: Bind existing production Render API
        shell: bash
        run: |
          printf '%s' "$IPILE_PRODUCTION_BACKEND_URL" | npx wrangler secret put BACKEND_URL --name ipile-web

      - name: Publish production Worker with production API binding
        run: npx wrangler deploy --name ipile-web
